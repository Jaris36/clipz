# CLIPZ on the VPS. Secrets come from .env (never committed).
# Pipeline: moment finder, Kick chat recorder, renderer (OpenShorts).
# The review page (phase 3) and the scout loop join later.
services:
  kick-chat:
    build: .
    command: ["python", "-m", "clipz.pipeline", "record-kick-chat"]
    env_file: .env
    volumes: ["./data:/app/data", "./config:/app/config:ro"]
    restart: unless-stopped

  watcher:
    build: .
    # One pass every hour: new VODs -> chat + viewer clips -> ranked moments.
    command: ["sh", "-c", "python -m clipz.pipeline init && while true; do python -m clipz.pipeline watch; sleep 3600; done"]
    env_file: .env
    volumes: ["./data:/app/data", "./config:/app/config:ro"]
    restart: unless-stopped

  notifier:
    build: .
    # Phase 2: sends scout and clip alerts to Telegram and records button taps. Never posts.
    command: ["python", "-m", "clipz.notify"]
    env_file: .env
    volumes: ["./data:/app/data", "./config:/app/config:ro"]
    restart: unless-stopped

  renderer:
    build: .
    # Every 15 minutes: best candidate moments -> vertical captioned clips (state "rendered").
    command: ["sh", "-c", "while true; do python -m clipz.pipeline render; sleep 900; done"]
    env_file: .env
    environment:
      - OPENSHORTS_URL=http://openshorts:8000
    volumes: ["./data:/app/data", "./config:/app/config:ro"]
    depends_on: [openshorts]
    restart: unless-stopped

  openshorts:
    # OpenShorts (MIT core), pinned to the commit Phase 2 was built against (2026-11-26).
    # CPU-only. Reads GEMINI_API_KEY from .env. Not exposed outside the server.
    build:
      context: https://github.com/mutonby/openshorts.git#cc07e6d1cd84bdbdba4f635949e26ed8433444c9
    env_file: .env
    volumes: ["./data/openshorts:/app/output"]
    expose: ["8000"]
    restart: unless-stopped
