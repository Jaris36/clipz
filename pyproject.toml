[project]
name = "clipz"
version = "0.1.0"
description = "Clip streamers, find paid clipping campaigns, post with a human tap."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2.7",
  "anthropic>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipz-scout = "clipz.scout.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
